<head>

<link href="https://fonts.googleapis.com/css2?family=Forum&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sage:#5B6F5E;--sage-light:#8BA08E;--sage-dark:#3E4E3F;--sage-bg:#E8EDE9;
  --gold:#C9AD6E;--gold-light:#E0CFA0;--gold-dark:#A68D4B;
  --cream:#F5F0E6;--cream-light:#FAFAF7;--cream-dark:#E8E0D0;
  --red:#C25B56;--green:#5B8C5A;--orange:#D4A24E;
  --text:#1E1E1E;--text2:#444;--text3:#888;
}
body{font-family:'Inter',sans-serif;background:#F0EDE6;color:var(--text);font-size:14px}

/* LOCK */
#lock-screen{position:fixed;inset:0;z-index:9999;background:var(--cream-light);display:flex;align-items:center;justify-content:center}
#lock-screen .lock-box{text-align:center;max-width:340px;padding:40px}
#lock-screen h2{font-family:'Forum',cursive;font-size:1.6rem;color:var(--sage-dark);margin-bottom:8px}
#lock-screen p{font-size:.9rem;color:var(--text3);margin-bottom:20px}
#lock-screen input{width:100%;padding:12px 16px;border:2px solid var(--gold-light);border-radius:10px;font-size:1rem;text-align:center;outline:none;letter-spacing:.15em}
#lock-screen input:focus{border-color:var(--sage)}
#lock-screen button{margin-top:14px;padding:10px 32px;background:var(--sage);color:#fff;border:none;border-radius:10px;font-family:'Forum',cursive;font-size:1rem;cursor:pointer}
#lock-screen .lock-err{color:var(--red);font-size:.85rem;margin-top:10px;min-height:1.2em}

#app{display:none}

/* TOPBAR */
.topbar{
  background:var(--sage-dark);color:#fff;padding:14px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:200;
}
.topbar h1{font-family:'Forum',cursive;font-size:1.15rem;letter-spacing:.03em;white-space:nowrap}
.topbar input{
  flex:1;min-width:160px;padding:7px 12px;border:none;border-radius:6px;
  font-size:.82rem;outline:none;background:rgba(255,255,255,.15);color:#fff;
}
.topbar input::placeholder{color:rgba(255,255,255,.5)}
.topbar select{
  padding:7px 10px;border:none;border-radius:6px;font-size:.82rem;
  background:rgba(255,255,255,.15);color:#fff;outline:none;
}
.topbar select option{color:#333;background:#fff}
.topbar .stats{font-size:.75rem;color:rgba(255,255,255,.6);white-space:nowrap}
.topbar .btn{
  padding:7px 14px;border:1px solid rgba(255,255,255,.3);background:transparent;
  color:#fff;border-radius:6px;font-size:.75rem;cursor:pointer;white-space:nowrap;
}
.topbar .btn:hover{background:rgba(255,255,255,.1)}

/* TABLE */
.table-wrap{overflow-x:auto;padding:0 8px 60px}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:900px}
thead{position:sticky;top:48px;z-index:100}
th{
  background:var(--sage);color:#fff;padding:10px 12px;
  font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;
  text-align:left;font-weight:600;white-space:nowrap;
  border-bottom:3px solid var(--gold);
}
th:first-child{border-radius:8px 0 0 0}
th:last-child{border-radius:0 8px 0 0}
th.r{text-align:right}
th.c{text-align:center}
th.kbju-group{background:var(--sage-dark);text-align:center;min-width:120px}

td{
  padding:10px 12px;font-size:.82rem;vertical-align:middle;
  border-bottom:1px solid #E5E0D5;background:var(--cream-light);
}
tr:nth-child(even) td{background:#F5F2EB}
tr:hover td{background:#EBE8DF}
tr.removed td{opacity:.4;text-decoration:line-through}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.c{text-align:center}
td.name{font-weight:600;font-size:.85rem;max-width:220px}
td.name .cat{display:block;font-weight:400;font-size:.7rem;color:var(--sage);margin-top:2px}
td.price{font-weight:700;font-size:.9rem;color:var(--sage-dark);white-space:nowrap}

/* KBJU cells */
td.kbju{
  font-variant-numeric:tabular-nums;white-space:nowrap;
  font-size:.8rem;text-align:center;
}
td.kbju .k{font-weight:700;color:var(--sage-dark);font-size:.88rem}
td.kbju .bju{color:var(--text2);font-size:.72rem;margin-top:1px}
td.kbju.empty{color:var(--text3);font-style:italic;font-size:.72rem}

/* STATUS */
.st{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.st-ok{background:var(--green)}
.st-miss{background:var(--red)}

/* COMPOSITION */
td.comp{font-size:.72rem;color:var(--text2);max-width:260px;line-height:1.4}
td.notes-cell{font-size:.72rem;color:var(--text3);max-width:180px;font-style:italic}

/* RESPONSIVE */
@media(max-width:768px){
  .topbar{padding:10px 12px}
  .topbar h1{font-size:.95rem}
  th,td{padding:8px 6px}
}
@media print{
  #lock-screen{display:none!important}
  #app{display:block!important}
  .topbar{position:relative;background:#333;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  thead{position:relative}
}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-box">
    <h2>База блюд</h2>
    <p>Введите пароль</p>
    <input type="password" id="lockPass" placeholder="Пароль" autofocus onkeydown="if(event.key==='Enter')unlock()">
    <button onclick="unlock()">Войти</button>
    <div class="lock-err" id="lockErr"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h1>База блюд ПП Феи</h1>
    <input type="text" id="search" placeholder="Поиск..." oninput="render()">
    <select id="catFilter" onchange="render()"></select>
    <select id="statusFilter" onchange="render()">
      <option value="all">Все</option>
      <option value="confirmed">КБЖУ есть</option>
      <option value="missing">КБЖУ нет</option>
    </select>
    <span class="stats" id="stats"></span>
    <button class="btn" onclick="exportCSV()">Скачать CSV</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead id="thead"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
function unlock(){
  if(document.getElementById('lockPass').value==='9237765384'){
    document.getElementById('lock-screen').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    document.getElementById('lockErr').textContent='Неверный пароль';
    document.getElementById('lockPass').value='';
    document.getElementById('lockPass').focus();
  }
}

function init(){
  const sel = document.getElementById('catFilter');
  sel.innerHTML = '<option value="all">Все категории</option>' +
    Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  render();
}

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const st = document.getElementById('statusFilter').value;
  const items = MENU.filter(item => {
    if(q && !item.name.toLowerCase().includes(q) && !(item.composition||'').toLowerCase().includes(q)) return false;
    if(cat !== 'all' && item.cat !== cat) return false;
    if(st === 'confirmed' && item.status !== 'confirmed') return false;
    if(st === 'missing' && item.status !== 'missing') return false;
    return true;
  });

  document.getElementById('thead').innerHTML = `<tr>
    <th style="width:30px">#</th>
    <th style="width:200px">Блюдо</th>
    <th class="r" style="width:80px">Цена</th>
    <th style="width:80px">Порция</th>
    <th class="c" style="width:26px"></th>
    <th class="kbju-group" style="width:130px">КБЖУ / 100 г</th>
    <th class="kbju-group" style="width:130px">КБЖУ / порция</th>
    <th style="width:70px">Приём</th>
    <th style="min-width:200px">Состав</th>
    <th style="width:160px">Заметки</th>
  </tr>`;

  document.getElementById('tbody').innerHTML = items.map(item => {
    const rc = !item.active ? ' class="removed"' : '';
    const cat_label = CATS[item.cat] || item.cat;

    const hasK = item.kcal != null;
    const fromTag = item.kcalFrom ? '<span style="color:var(--gold-dark);font-weight:600">от </span>' : '';
    const kbju100 = hasK
      ? `<span class="k">${fromTag}${item.kcal}</span><span class="bju">Б ${item.p} · Ж ${item.f} · У ${item.c}</span>`
      : 'нет данных';
    const kbjuCls100 = hasK ? 'kbju' : 'kbju empty';

    const hasP = hasK && item.w;
    const kbjuP = hasP
      ? `<span class="k">${fromTag}${Math.round(item.kcal*item.w/100)}</span><span class="bju">Б ${Math.round(item.p*item.w/100)} · Ж ${Math.round(item.f*item.w/100)} · У ${Math.round(item.c*item.w/100)}</span>`
      : (item.w ? 'нет КБЖУ' : 'нет веса');
    const kbjuClsP = hasP ? 'kbju' : 'kbju empty';

    const stDot = item.status === 'confirmed'
      ? '<span class="st st-ok" title="КБЖУ подтверждено"></span>'
      : '<span class="st st-miss" title="КБЖУ нет"></span>';

    const priceStr = item.price != null
      ? `<strong>${item.price.toLocaleString('ru-RU')}</strong> ₽`
      : '<span style="color:var(--text3)">—</span>';

    return `<tr${rc}>
      <td class="c" style="color:var(--text3);font-size:.72rem">${item.id}</td>
      <td class="name">${item.name}<span class="cat">${cat_label}${item.type!=='ПП'?' · '+item.type:''}</span></td>
      <td class="r price">${priceStr}</td>
      <td>${item.variant}</td>
      <td class="c">${stDot}</td>
      <td class="${kbjuCls100}">${kbju100}</td>
      <td class="${kbjuClsP}">${kbjuP}</td>
      <td style="font-size:.75rem;color:var(--text2)">${item.meal}</td>
      <td class="comp">${item.composition || '<span style="color:var(--text3)">—</span>'}</td>
      <td class="notes-cell">${item.notes || '—'}</td>
    </tr>`;
  }).join('');

  const total = MENU.filter(i=>i.active).length;
  const ok = MENU.filter(i=>i.active && i.status==='confirmed').length;
  document.getElementById('stats').textContent =
    `${items.length} из ${total} · КБЖУ: ${ok}/${total}`;
}

function exportCSV(){
  const BOM = '\uFEFF'; const sep = ';';
  const h = ['ID','Название','Категория','Порция','Вес (г)','Цена (₽)','Ккал/100г','Б/100г','Ж/100г','У/100г','Ккал/порц','Б/порц','Ж/порц','У/порц','Приём пищи','Тип','Статус','Состав','Рецептура','Заметки','Активно'];
  const rows = MENU.map(i => {
    const kP=(i.kcal!=null&&i.w)?Math.round(i.kcal*i.w/100):'';
    const pP=(i.p!=null&&i.w)?Math.round(i.p*i.w/100):'';
    const fP=(i.f!=null&&i.w)?Math.round(i.f*i.w/100):'';
    const cP=(i.c!=null&&i.w)?Math.round(i.c*i.w/100):'';
    return [i.id,q(i.name),CATS[i.cat]||i.cat,q(i.variant),i.w||'',i.price||'',i.kcal!=null?i.kcal:'',i.p!=null?i.p:'',i.f!=null?i.f:'',i.c!=null?i.c:'',kP,pP,fP,cP,i.meal,i.type,i.status==='confirmed'?'да':'нет',q(i.composition),q(i.recipe),q(i.notes),i.active?'да':'нет'].join(sep);
  });
  const csv = BOM + h.join(sep)+'\n'+rows.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = 'menu-pp-feya.csv'; a.click();
}
function q(s){return '"'+(s||'').replace(/"/g,'""')+'"'}

init();
